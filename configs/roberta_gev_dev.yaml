# Development stage for the activation-whitened (curvature-aware) fixed basis:
# SST-2 / RTE / MNLI x seeds 361-363 x wire 5/10/20%, train-holdout.
#
# Probe result (MNLI seed 361, docs/proposals/RESEARCH_DIRECTIONS.md): every basis
# containing the shared activation mean direction stalled; whitening the basis
# (A Sigma_x A^T = c^2 I) removed the stall and gev0 reached 0.813 at 10% vs random
# 0.786 / spectral 0.793 (dense 0.826).  This stage checks whether that holds across
# tasks and seeds and separates the ingredients:
#   gev0_a_ef      generalized eigenvectors of (Gbar^T Gbar, Sigma_x), kappa = 0
#   gev_a_ef       same with the CAB heterogeneity penalty kappa
#   cab0wh_a_ef    Euclidean consensus subspace, whitened within (subspace vs conditioning)
#   randomwh_a_ef  random subspace, whitened within (conditioning alone)
# Baselines (fedavg_lora, random_a_ef, spectral_a_ef, cab0_a_ef, cab_a_ef) come from
# bishe_cab cab_ef_dev with identical data, partitions, learning rates and seeds.
project:
  phase: tune
  root: /data/home/202412012250/bishe_gevdev
  output_dir: /data/home/202412012250/bishe_gevdev/docs/results/gev_dev
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt
  expected_runs: 108

model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes:
    - attention.self.query
    - attention.self.value
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-5

data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2, rte, mnli]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [361, 362, 363]

training:
  rounds:
    sst2: 30
    rte: 50
    mnli: 50
  local_steps:
    sst2: 8
    rte: 8
    mnli: 16
  batch_size:
    sst2: 128
    rte: 16
    mnli: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    fedavg_lora: &full_lora_lr
      learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
    random_a_ef: &fixed_a_lr
      learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
    spectral_a_ef: *fixed_a_lr
    cab0_a_ef: *fixed_a_lr
    cab_a_ef: *fixed_a_lr
    gev0_a_ef: *fixed_a_lr
    gev_a_ef: *fixed_a_lr
    cab0wh_a_ef: *fixed_a_lr
    randomwh_a_ef: *fixed_a_lr
    gev0x_a_ef: *fixed_a_lr
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: {sst2: 1, rte: 1, mnli: 5}
  checkpoint_every: 1

evaluation:
  policy: train_holdout

communication:
  wire_ratios: [0.05, 0.10, 0.20]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true

cab:
  # assumed prior (see header); not a measured contraction
  gamma: {sst2: 0.1, rte: 0.1, mnli: 0.1}
  gamma_source: assumed
  kappa_multiplier: 1.0
  kappa_override: null
  # rank of each client's truncated gradient SVD (balanced FP16 factors)
  client_rank: 8
  gradient_examples: 1024
  gradient_batch_size: 64
  # input second-moment sketch: top-16 eigenpairs + diagonal remainder, FP16
  activation_rank: 16
  activation_ridge: 1.0e-3

matrix:
  dense_methods: []
  sparse_methods: [gev0_a_ef, gev_a_ef, cab0wh_a_ef, randomwh_a_ef]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
