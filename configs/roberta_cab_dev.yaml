# CAB development stage (train-holdout evaluation, development seeds 361-363).
#
# Question: under identical delivered bytes and DCEF synchronisation, does the
# closed-form communication-aware basis
#     A* = TopEig_r(Gbar^T Gbar - kappa * Sigma_het)
# beat the random, pretrained-spectral and consensus-gradient (kappa = 0) bases,
# and does its advantage over kappa = 0 grow as the budget shrinks?
#
# All four fixed-A arms share learning rates, sync rule (DCEF), message cap and
# minibatch seeds; they differ only in A.  CAB arms also pay their one-time
# rank-8 gradient-factor upload and FP16 basis broadcast inside delivered bytes.
# fedavg_lora is the dense C95/retention reference.  full_lora_dcef is an
# opt-in cross-family diagnostic (run_matrix.py --include-diagnostics).
#
# LAUNCH GATE: cab.gamma must be replaced by the per-task median gamma_bar of
# random_a_dcef from the DCEF development stage:
#   python3 scripts/calibrate_cab_gamma.py --runs docs/results/dcef_dev/DCEF_RUNS.csv
# then set gamma_source: dcef_dev.  Config validation rejects provisional gamma
# outside smoke.  Use a separate output_dir for kappa_multiplier sweeps.
project:
  phase: tune
  root: /data/home/202412012250/bishe_dcef
  output_dir: /data/home/202412012250/bishe_dcef/docs/results/cab_dev
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt
  expected_runs: 117

model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes:
    - attention.self.query
    - attention.self.value
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-5

data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2, rte, mnli]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [361, 362, 363]

training:
  rounds:
    sst2: 30
    rte: 50
    mnli: 50
  local_steps:
    sst2: 8
    rte: 8
    mnli: 16
  batch_size:
    sst2: 128
    rte: 16
    mnli: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    fedavg_lora: &full_lora_lr
      learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
    full_lora_dcef: *full_lora_lr
    random_a_dcef: &fixed_a_lr
      learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
    spectral_a_dcef: *fixed_a_lr
    cab0_a_dcef: *fixed_a_lr
    cab_a_dcef: *fixed_a_lr
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: {sst2: 1, rte: 1, mnli: 5}
  checkpoint_every: 1

evaluation:
  policy: train_holdout

communication:
  wire_ratios: [0.05, 0.10, 0.20]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true

cab:
  # PROVISIONAL placeholders: replace with calibrated values before launch.
  gamma: {sst2: 0.1, rte: 0.1, mnli: 0.1}
  gamma_source: provisional
  kappa_multiplier: 1.0
  kappa_override: null
  # rank of each client's truncated gradient SVD (balanced FP16 factors)
  client_rank: 8
  gradient_examples: 1024
  gradient_batch_size: 64

matrix:
  dense_methods: [fedavg_lora]
  sparse_methods: [random_a_dcef, spectral_a_dcef, cab0_a_dcef, cab_a_dcef]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: [full_lora_dcef]
