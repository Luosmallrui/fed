# Fed-SB-normalized learning-rate sweep, lr 3e-4 (train-holdout, seed 42, 10% budget), same rule as Fed-SB.
project:
  phase: tune
  root: /data/home/202412012250/bishe_norm
  output_dir: /data/home/202412012250/bishe_norm/docs/results/normfix_dev_lr_3e-4
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_norm/artifacts/spectral/roberta-base-qv-r8-fp32.pt
  expected_runs: 3
model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes:
  - attention.self.query
  - attention.self.value
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-05
data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks:
  - sst2
  - mnli
  - qnli
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds:
  - 42
training:
  rounds:
    sst2: 30
    mnli: 50
    qnli: 30
  local_steps:
    sst2: 8
    mnli: 16
    qnli: 16
  batch_size:
    sst2: 128
    mnli: 128
    qnli: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    fedsb_norm:
      learning_rate:
        sst2: 0.0003
        mnli: 0.0003
        qnli: 0.0003
      head_learning_rate:
        sst2: 0.0003
        mnli: 0.0003
        qnli: 0.0003
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every:
    sst2: 1
    mnli: 5
    qnli: 3
  checkpoint_every: 1
evaluation:
  policy: train_holdout
communication:
  wire_ratios:
  - 0.1
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true
cab:
  gamma:
    sst2: 0.1
    mnli: 0.1
    qnli: 0.1
  gamma_source: assumed
  kappa_multiplier: 1.0
  kappa_override: null
  client_rank: 4
  gradient_examples: 1024
  gradient_batch_size: 64
  activation_rank: 8
  activation_ridge: 0.001
  factor_dtype: float16
  basis_dtype: float16
matrix:
  dense_methods: []
  sparse_methods:
  - fedsb_norm
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
baselines:
  fedsb_gradient_examples: 1024
  fedsb_gradient_batch_size: 64
