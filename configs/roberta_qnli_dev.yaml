# QNLI development stage (replaces RTE), seed 42 only, train-holdout.
# Learning rates come from the seed-42 baseline sweep (configs/roberta_qnli_lr_*.yaml):
# fixed-A rate 0.001 (best random_a_ef at 10% by the mean of the last three evaluations,
# 0.743 vs 0.716 at 3e-3, whose higher final 0.769 is a single late jump; 1e-2 diverged),
# shared by every fixed-A arm, so
# gev0 / cab0wh / randomwh receive no tuning of their own; fedavg_lora uses 0.001
# (best dense rate; 3e-3 diverged).
# Arms: dense FedAvg-LoRA reference + random, spectral, cab0 (Euclidean kappa = 0),
# gev0 (curvature-aware generalized eigenvectors), cab0wh and randomwh (whitening
# ablations) at 5/10/20% exact-wire budgets: 19 runs.  Same 30 x 16 x 128 schedule.
project:
  phase: tune
  root: /data/home/202412012250/bishe_qnli
  output_dir: /data/home/202412012250/bishe_qnli/docs/results/qnli_dev
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt
  expected_runs: 19
model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes:
  - attention.self.query
  - attention.self.value
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-05
data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks:
  - qnli
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds:
  - 42
training:
  rounds:
    qnli: 30
  local_steps:
    qnli: 16
  batch_size:
    qnli: 128
  eval_batch_size: 512
  learning_rate: 0.001
  head_learning_rate: 0.001
  method_overrides:
    fedavg_lora:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    random_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    spectral_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    cab0_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    gev0_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    cab0wh_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
    randomwh_a_ef:
      learning_rate:
        qnli: 0.001
      head_learning_rate:
        qnli: 0.001
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every:
    qnli: 3
  checkpoint_every: 1
evaluation:
  policy: train_holdout
communication:
  wire_ratios:
  - 0.05
  - 0.1
  - 0.2
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true
cab:
  gamma:
    qnli: 0.1
  gamma_source: assumed
  kappa_multiplier: 1.0
  kappa_override: null
  client_rank: 8
  gradient_examples: 1024
  gradient_batch_size: 64
  activation_rank: 16
  activation_ridge: 0.001
matrix:
  dense_methods:
  - fedavg_lora
  sparse_methods:
  - random_a_ef
  - spectral_a_ef
  - cab0_a_ef
  - gev0_a_ef
  - cab0wh_a_ef
  - randomwh_a_ef
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
