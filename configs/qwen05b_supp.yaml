  eval_batch_size: 512
  learning_rate: 0.001
  head_learning_rate: 0.001
  method_overrides:
    fedavg_lora:
      learning_rate:
        mnli: 0.0001
      head_learning_rate:
        mnli: 0.0001
    random_a_ef:
      learning_rate:
        mnli: 0.001
      head_learning_rate:
        mnli: 0.001
