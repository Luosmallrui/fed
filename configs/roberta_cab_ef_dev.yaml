# CAB development stage with STANDARD bidirectional EF (train-holdout, seeds 361-363).
#
# DCEF (the first proposed sync rule) lost to standard EF in the DCEF dev stage
# (client virtual starts drift under non-IID data; its secant gamma estimate was
# contaminated by that drift), so CAB is evaluated on top of standard EF.
#
# Question: at identical delivered bytes and standard EF synchronisation, does
#     A* = TopEig_r(Gbar^T Gbar - kappa * Sigma_het)
# beat random, pretrained-spectral and consensus-gradient (kappa = 0) bases, and
# does its advantage over kappa = 0 grow as the budget shrinks?
#
# kappa uses the closed form with an ASSUMED gamma = 0.1 (a declared prior, not a
# measurement), fixed before any CAB outcome was seen.  The zero-training probe
# (docs/results/exploration/cab_ef_probe, seed 361) showed heterogeneity/consensus
# energy ratios of 5-12, so this gamma gives kappa*ratio ~ 0.7-4 across budgets:
# the regime where the theory says the kappa term changes the basis.
#
# All four fixed-A arms share learning rates, EF, message cap and minibatch seeds;
# they differ only in A.  CAB arms also pay their one-time rank-8 gradient-factor
# upload and FP16 basis broadcast inside delivered bytes.  fedavg_lora is the dense
# C95/retention reference.  Code lives in bishe_cab; data, model, tokenized cache
# and partitions are shared read-only with bishe_dcef.
project:
  phase: tune
  root: /data/home/202412012250/bishe_cab
  output_dir: /data/home/202412012250/bishe_cab/docs/results/cab_ef_dev
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt
  expected_runs: 117

model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes:
    - attention.self.query
    - attention.self.value
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-5

data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2, rte, mnli]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [361, 362, 363]

training:
  rounds:
    sst2: 30
    rte: 50
    mnli: 50
  local_steps:
    sst2: 8
    rte: 8
    mnli: 16
  batch_size:
    sst2: 128
    rte: 16
    mnli: 128
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    fedavg_lora: &full_lora_lr
      learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.001, rte: 0.0003, mnli: 0.001}
    random_a_ef: &fixed_a_lr
      learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
    spectral_a_ef: *fixed_a_lr
    cab0_a_ef: *fixed_a_lr
    cab_a_ef: *fixed_a_lr
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: {sst2: 1, rte: 1, mnli: 5}
  checkpoint_every: 1

evaluation:
  policy: train_holdout

communication:
  wire_ratios: [0.05, 0.10, 0.20]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true

cab:
  # assumed prior (see header); not a measured contraction
  gamma: {sst2: 0.1, rte: 0.1, mnli: 0.1}
  gamma_source: assumed
  kappa_multiplier: 1.0
  kappa_override: null
  # rank of each client's truncated gradient SVD (balanced FP16 factors)
  client_rank: 8
  gradient_examples: 1024
  gradient_batch_size: 64

matrix:
  dense_methods: [fedavg_lora]
  sparse_methods: [random_a_ef, spectral_a_ef, cab0_a_ef, cab_a_ef]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
