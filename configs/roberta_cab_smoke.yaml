# Implementation smoke for the communication-aware fixed basis (CAB).
# Checks gradient factor upload, the basis broadcast, setup-byte accounting, the
# basis cache on resume, and DCEF synchronisation on a CAB basis.
# gamma is provisional (allowed only in smoke). No result is method evidence.
project:
  phase: smoke
  root: /data/home/202412012250/bishe_dcef
  output_dir: /data/home/202412012250/bishe_dcef/docs/results/exploration/cab_smoke
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions-smoke
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt

model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes: [attention.self.query, attention.self.value]
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-5

data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 2
  clients_per_round: 2
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [311]

training:
  rounds: {sst2: 3}
  local_steps: {sst2: 2}
  batch_size: {sst2: 16}
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    random_a_dcef: &fixed_a_lr
      learning_rate: 0.0003
      head_learning_rate: 0.0003
    cab0_a_dcef: *fixed_a_lr
    cab_a_dcef: *fixed_a_lr
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: 1
  checkpoint_every: 1

evaluation:
  policy: official_validation

communication:
  wire_ratios: [0.10]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true

cab:
  gamma: 0.2
  gamma_source: provisional
  kappa_multiplier: 1.0
  kappa_override: null
  # rank of each client's truncated gradient SVD (balanced FP16 factors)
  client_rank: 8
  gradient_examples: 64
  gradient_batch_size: 16

matrix:
  dense_methods: []
  sparse_methods: [random_a_dcef, cab0_a_dcef, cab_a_dcef]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
