# Zero-training probe for CAB with standard EF: one round on the dev partitions (seed 361)
# to read the heterogeneity/consensus energy ratio that sets the scale of kappa.
# Code lives in bishe_cab; data, model, tokenized cache and partitions are shared
# read-only with bishe_dcef (identical files and digests).
# Checks gradient factor upload, the basis broadcast, setup-byte accounting, the
# basis cache on resume, and DCEF synchronisation on a CAB basis.
# gamma is provisional (allowed only in smoke). No result is method evidence.
project:
  phase: smoke
  root: /data/home/202412012250/bishe_cab
  output_dir: /data/home/202412012250/bishe_cab/docs/results/exploration/cab_ef_probe
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_dcef/artifacts/partitions
  spectral_cache: /data/home/202412012250/bishe_dcef/artifacts/spectral/roberta-base-qv-r8-fp32.pt

model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes: [attention.self.query, attention.self.value]
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-5

data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2, rte, mnli]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 10
  clients_per_round: 10
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [361]

training:
  rounds: {sst2: 1, rte: 1, mnli: 1}
  local_steps: {sst2: 8, rte: 8, mnli: 16}
  batch_size: {sst2: 128, rte: 16, mnli: 128}
  eval_batch_size: 512
  learning_rate: 0.0003
  head_learning_rate: 0.0003
  method_overrides:
    cab_a_ef:
      learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
      head_learning_rate: {sst2: 0.0003, rte: 0.0003, mnli: 0.001}
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: 1
  checkpoint_every: 1

evaluation:
  policy: train_holdout

communication:
  wire_ratios: [0.05, 0.10, 0.20]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true

cab:
  gamma: 0.1
  gamma_source: provisional
  kappa_multiplier: 1.0
  kappa_override: null
  # rank of each client's truncated gradient SVD (balanced FP16 factors)
  client_rank: 8
  gradient_examples: 1024
  gradient_batch_size: 64

matrix:
  dense_methods: []
  sparse_methods: [cab_a_ef]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
