# Smoke test for the published federated LoRA baselines (fedpeft.baselines): every method runs
# end to end on a tiny SST-2 setting (3 clients so stacked merges have K > 2; 4 rounds so RoLoRA
# alternates twice and FedSVD re-factorises repeatedly).
project:
  phase: smoke
  root: /data/home/202412012250/bishe_base
  output_dir: /data/home/202412012250/bishe_base/docs/results/baselines_smoke
  tokenized_dir: /data/home/202412012250/bishe_dcef/artifacts/tokenized
  partition_dir: /data/home/202412012250/bishe_base/artifacts/partitions-smoke
  spectral_cache: /data/home/202412012250/bishe_base/artifacts/spectral/roberta-base-qv-r8-fp32.pt
model:
  path: /data/home/202412012250/bishe_dcef/models/roberta-base
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_suffixes: [attention.self.query, attention.self.value]
  torch_dtype: float32
  basis_seed: 20260910
  lora_xs_init_std: 1.0e-05
data:
  root: /data/home/202412012250/bishe_dcef/datasets
  tasks: [sst2]
  max_length: 128
  preprocessing_workers: 8
  gpu_resident: true
  num_clients: 3
  clients_per_round: 3
  dirichlet_alpha: 0.3
  local_holdout_fraction: 0.1
  min_client_examples: 24
  partition_seeds: [1001]
training:
  rounds: {sst2: 4}
  local_steps: {sst2: 4}
  batch_size: {sst2: 32}
  eval_batch_size: 512
  learning_rate: 0.001
  head_learning_rate: 0.001
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: bfloat16
  eval_every: {sst2: 1}
  checkpoint_every: 1
evaluation:
  policy: official_validation
communication:
  wire_ratios: [0.1]
  value_dtype: float16
  index_dtype: uint32
  count_downlink_per_client: true
  schema_once_per_run: true
baselines:
  fedsb_gradient_examples: 256
  fedsb_gradient_batch_size: 64
matrix:
  dense_methods: [fedavg_lora, random_a_dense, flora_dense, fedex_dense, rolora_dense, fedsvd_dense]
  sparse_methods: [random_a_ef, full_lora_ef, rolora_ef, fedsvd_ef, fedsb]
  diagnostic_dense_methods: []
  diagnostic_sparse_methods: []
